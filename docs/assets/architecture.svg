<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">RSNA pipeline architecture</title>
  <desc id="desc">Five-stage flow from CT input to published audits.</desc>
  <rect width="1200" height="370" fill="#0B1220"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#F1F5F9" font-size="32" font-weight="700">What happens in this pipeline</text>
    <text x="40" y="82" fill="#94A3B8" font-size="18">From CT slices to audited metrics — medical images stay off the public repository.</text>
    <rect x="40" y="120" rx="20" ry="20" width="200" height="170" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <circle cx="76" cy="158" r="14" fill="#14B8A6"/>
    <text x="100" y="166" fill="#F1F5F9" font-size="22" font-weight="700">1. CT input</text>
    <text x="64" y="210" fill="#94A3B8" font-size="16">DICOM / SQLite</text>
    <text x="64" y="238" fill="#94A3B8" font-size="16">HU window + stacks</text>
    <rect x="270" y="120" rx="20" ry="20" width="200" height="170" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="306" cy="158" r="14" fill="#38BDF8"/>
    <text x="330" y="166" fill="#F1F5F9" font-size="22" font-weight="700">2. Split</text>
    <text x="294" y="210" fill="#94A3B8" font-size="16">study GroupKFold</text>
    <text x="294" y="238" fill="#94A3B8" font-size="16">leakage audit</text>
    <rect x="500" y="120" rx="20" ry="20" width="200" height="170" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="536" cy="158" r="14" fill="#F59E0B"/>
    <text x="560" y="166" fill="#F1F5F9" font-size="22" font-weight="700">3. Model</text>
    <text x="524" y="210" fill="#94A3B8" font-size="16">ConvNeXt 2.5D</text>
    <text x="524" y="238" fill="#94A3B8" font-size="16">weighted logloss</text>
    <rect x="730" y="120" rx="20" ry="20" width="200" height="170" fill="#152033" stroke="#84CC16" stroke-width="3"/>
    <circle cx="766" cy="158" r="14" fill="#84CC16"/>
    <text x="790" y="166" fill="#F1F5F9" font-size="22" font-weight="700">4. Calibrate</text>
    <text x="754" y="210" fill="#94A3B8" font-size="16">temperature + ECE</text>
    <text x="754" y="238" fill="#94A3B8" font-size="16">MC Dropout</text>
    <rect x="960" y="120" rx="20" ry="20" width="200" height="170" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <circle cx="996" cy="158" r="14" fill="#F43F5E"/>
    <text x="1020" y="166" fill="#F1F5F9" font-size="22" font-weight="700">5. Publish</text>
    <text x="984" y="210" fill="#94A3B8" font-size="16">reports + checks</text>
    <text x="984" y="238" fill="#94A3B8" font-size="16">no patient images</text>
    <path d="M240 205 H268" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><path d="M260 193 L274 205 L260 217" fill="#94A3B8"/>
    <path d="M470 205 H498" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><path d="M490 193 L504 205 L490 217" fill="#94A3B8"/>
    <path d="M700 205 H728" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><path d="M720 193 L734 205 L720 217" fill="#94A3B8"/>
    <path d="M930 205 H958" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><path d="M950 193 L964 205 L950 217" fill="#94A3B8"/>
    <text x="40" y="340" fill="#94A3B8" font-size="15">Public bundle = code + configs + summary JSON. Datasets/, results/, and *.pt weights are excluded.</text>
  </g>
</svg>
