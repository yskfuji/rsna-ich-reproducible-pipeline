<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">RSNA pipeline architecture</title>
  <desc id="desc">Five-stage pipeline overview.</desc>
  <rect width="960" height="510" fill="#0B1220"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">What happens in this pipeline</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">CT slices to audited metrics. Medical images stay off the public repository.</text>
    <rect x="40" y="110" rx="16" ry="16" width="260" height="140" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <circle cx="68" cy="142" r="12" fill="#14B8A6"/>
    <text x="90" y="148" fill="#F1F5F9" font-size="20" font-weight="700">1. CT input</text>
    <text x="60" y="188" fill="#94A3B8" font-size="15">DICOM / SQLite</text>
    <text x="60" y="214" fill="#94A3B8" font-size="15">HU window + stacks</text>
    <rect x="340" y="110" rx="16" ry="16" width="260" height="140" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="368" cy="142" r="12" fill="#38BDF8"/>
    <text x="390" y="148" fill="#F1F5F9" font-size="20" font-weight="700">2. Split</text>
    <text x="360" y="188" fill="#94A3B8" font-size="15">study GroupKFold</text>
    <text x="360" y="214" fill="#94A3B8" font-size="15">leakage audit</text>
    <rect x="640" y="110" rx="16" ry="16" width="260" height="140" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="668" cy="142" r="12" fill="#F59E0B"/>
    <text x="690" y="148" fill="#F1F5F9" font-size="20" font-weight="700">3. Model</text>
    <text x="660" y="188" fill="#94A3B8" font-size="15">ConvNeXt 2.5D</text>
    <text x="660" y="214" fill="#94A3B8" font-size="15">weighted logloss</text>
    <rect x="190" y="300" rx="16" ry="16" width="260" height="140" fill="#152033" stroke="#84CC16" stroke-width="3"/>
    <circle cx="218" cy="332" r="12" fill="#84CC16"/>
    <text x="240" y="338" fill="#F1F5F9" font-size="20" font-weight="700">4. Calibrate</text>
    <text x="210" y="378" fill="#94A3B8" font-size="15">temperature + ECE</text>
    <text x="210" y="404" fill="#94A3B8" font-size="15">MC Dropout</text>
    <rect x="490" y="300" rx="16" ry="16" width="260" height="140" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <circle cx="518" cy="332" r="12" fill="#F43F5E"/>
    <text x="540" y="338" fill="#F1F5F9" font-size="20" font-weight="700">5. Publish</text>
    <text x="510" y="378" fill="#94A3B8" font-size="15">reports + checks</text>
    <text x="510" y="404" fill="#94A3B8" font-size="15">no patient images</text>
    <path d="M300 180 H330" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M600 180 H630" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M450 250 V290" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <text x="40" y="480" fill="#94A3B8" font-size="14">Public bundle = code + configs + summary JSON. Datasets/, results/, *.pt excluded.</text>
  </g>
</svg>
