<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 694" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">RSNA pipeline architecture</title>
  <desc id="desc">Five-stage pipeline overview.</desc>
  <rect width="960" height="694" fill="#0B1220"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">What happens in this pipeline</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">CT slices to audited metrics. Medical images stay off the public repository.</text>
    <rect x="40" y="100" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <circle cx="68" cy="139" r="11" fill="#14B8A6"/>
    <text x="92" y="146" fill="#F1F5F9" font-size="20" font-weight="700">1. CT input</text>
    <text x="320" y="146" fill="#94A3B8" font-size="15">DICOM / SQLite</text>
    <text x="600" y="146" fill="#94A3B8" font-size="15">HU window + stacks</text>
    <rect x="40" y="214" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="68" cy="253" r="11" fill="#38BDF8"/>
    <text x="92" y="260" fill="#F1F5F9" font-size="20" font-weight="700">2. Split</text>
    <text x="320" y="260" fill="#94A3B8" font-size="15">study GroupKFold</text>
    <text x="600" y="260" fill="#94A3B8" font-size="15">leakage audit</text>
    <rect x="40" y="328" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="68" cy="367" r="11" fill="#F59E0B"/>
    <text x="92" y="374" fill="#F1F5F9" font-size="20" font-weight="700">3. Model</text>
    <text x="320" y="374" fill="#94A3B8" font-size="15">ConvNeXt 2.5D</text>
    <text x="600" y="374" fill="#94A3B8" font-size="15">weighted logloss</text>
    <rect x="40" y="442" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#84CC16" stroke-width="3"/>
    <circle cx="68" cy="481" r="11" fill="#84CC16"/>
    <text x="92" y="488" fill="#F1F5F9" font-size="20" font-weight="700">4. Calibrate</text>
    <text x="320" y="488" fill="#94A3B8" font-size="15">temperature + ECE</text>
    <text x="600" y="488" fill="#94A3B8" font-size="15">MC Dropout</text>
    <rect x="40" y="556" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <circle cx="68" cy="595" r="11" fill="#F43F5E"/>
    <text x="92" y="602" fill="#F1F5F9" font-size="20" font-weight="700">5. Publish</text>
    <text x="320" y="602" fill="#94A3B8" font-size="15">reports + checks</text>
    <text x="600" y="602" fill="#94A3B8" font-size="15">no patient images</text>
    <line x1="480.0" y1="178.0" x2="480.0" y2="203.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,214.0 475.0,204.0 485.0,204.0" fill="#94A3B8"/>
    <line x1="480.0" y1="292.0" x2="480.0" y2="317.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,328.0 475.0,318.0 485.0,318.0" fill="#94A3B8"/>
    <line x1="480.0" y1="406.0" x2="480.0" y2="431.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,442.0 475.0,432.0 485.0,432.0" fill="#94A3B8"/>
    <line x1="480.0" y1="520.0" x2="480.0" y2="545.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,556.0 475.0,546.0 485.0,546.0" fill="#94A3B8"/>
    <text x="40" y="670" fill="#94A3B8" font-size="14">Public bundle = code + configs + summary JSON. Datasets/, results/, *.pt excluded.</text>
  </g>
</svg>
