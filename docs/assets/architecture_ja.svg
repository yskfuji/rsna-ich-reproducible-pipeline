<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 694" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">RSNAパイプラインの構成</title>
  <desc id="desc">五段階の処理概要。</desc>
  <rect width="960" height="694" fill="#0B1220"/>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Yu Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">本パイプラインの処理流れ</text>
    <text x="40" y="74.0" fill="#94A3B8" font-size="15" font-weight="400">CTスライスから監査可能な指標まで。患者画像は公開物に含めない。</text>
    <rect x="40" y="100" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <circle cx="480" cy="122" r="7" fill="#14B8A6"/>
    <text x="480" y="148" fill="#F1F5F9" font-size="20" font-weight="700" text-anchor="middle">1. CT入力</text>
    <text x="480" y="168" fill="#94A3B8" font-size="14" text-anchor="middle">DICOM / SQLite  ·  HU窓処理とスライス積上げ</text>
    <rect x="40" y="214" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="480" cy="236" r="7" fill="#38BDF8"/>
    <text x="480" y="262" fill="#F1F5F9" font-size="20" font-weight="700" text-anchor="middle">2. 分割</text>
    <text x="480" y="282" fill="#94A3B8" font-size="14" text-anchor="middle">検査単位のGroupKFold  ·  情報リークの監査</text>
    <rect x="40" y="328" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="480" cy="350" r="7" fill="#F59E0B"/>
    <text x="480" y="376" fill="#F1F5F9" font-size="20" font-weight="700" text-anchor="middle">3. モデル</text>
    <text x="480" y="396" fill="#94A3B8" font-size="14" text-anchor="middle">ConvNeXt 2.5D  ·  加重対数損失</text>
    <rect x="40" y="442" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#84CC16" stroke-width="3"/>
    <circle cx="480" cy="464" r="7" fill="#84CC16"/>
    <text x="480" y="490" fill="#F1F5F9" font-size="20" font-weight="700" text-anchor="middle">4. 校正</text>
    <text x="480" y="510" fill="#94A3B8" font-size="14" text-anchor="middle">温度スケーリングとECE  ·  MC Dropout</text>
    <rect x="40" y="556" rx="14" ry="14" width="880" height="78" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <circle cx="480" cy="578" r="7" fill="#F43F5E"/>
    <text x="480" y="604" fill="#F1F5F9" font-size="20" font-weight="700" text-anchor="middle">5. 公開</text>
    <text x="480" y="624" fill="#94A3B8" font-size="14" text-anchor="middle">報告書と検査  ·  患者画像なし</text>
    <line x1="480.0" y1="178.0" x2="480.0" y2="203.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,214.0 475.0,204.0 485.0,204.0" fill="#94A3B8"/>
    <line x1="480.0" y1="292.0" x2="480.0" y2="317.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,328.0 475.0,318.0 485.0,318.0" fill="#94A3B8"/>
    <line x1="480.0" y1="406.0" x2="480.0" y2="431.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,442.0 475.0,432.0 485.0,432.0" fill="#94A3B8"/>
    <line x1="480.0" y1="520.0" x2="480.0" y2="545.0" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="480.0,556.0 475.0,546.0 485.0,546.0" fill="#94A3B8"/>
    <text x="40" y="670.0" fill="#94A3B8" font-size="13" font-weight="400">公開物はコード・設定・要約JSONである。Datasets/、results/、*.pt は含めない。</text>
  </g>
</svg>
