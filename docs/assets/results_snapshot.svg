<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">RSNA metrics snapshot</title>
  <desc id="desc">Four headline metrics as cards with bars.</desc>
  <rect width="1200" height="410" fill="#0B1220"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#F1F5F9" font-size="32" font-weight="700">3-minute metrics snapshot</text>
    <text x="40" y="82" fill="#94A3B8" font-size="18">Mean ± sample SD (ddof=1). Source: core/pipeline/reports/rsna_cv_summary.json</text>
    <rect x="40" y="110" rx="20" ry="20" width="250" height="230" fill="#152033"/>
    <text x="62" y="150" fill="#94A3B8" font-size="16">Weighted logloss ↓</text>
    <text x="62" y="205" fill="#F1F5F9" font-size="26" font-weight="700">0.05346 ± 0.00624</text>
    <text x="62" y="240" fill="#94A3B8" font-size="15">5 folds</text>
    <rect x="62" y="270" width="206" height="16" rx="8" fill="#1F2A3D"/>
    <rect x="62" y="270" width="26" height="16" rx="8" fill="#38BDF8"/>
    <rect x="320" y="110" rx="20" ry="20" width="250" height="230" fill="#152033"/>
    <text x="342" y="150" fill="#94A3B8" font-size="16">Mean AUC ↑</text>
    <text x="342" y="205" fill="#F1F5F9" font-size="26" font-weight="700">0.98815 ± 0.00311</text>
    <text x="342" y="240" fill="#94A3B8" font-size="15">5 folds</text>
    <rect x="342" y="270" width="206" height="16" rx="8" fill="#1F2A3D"/>
    <rect x="342" y="270" width="217" height="16" rx="8" fill="#84CC16"/>
    <rect x="600" y="110" rx="20" ry="20" width="250" height="230" fill="#152033"/>
    <text x="622" y="150" fill="#94A3B8" font-size="16">Error AUROC ↑</text>
    <text x="622" y="205" fill="#F1F5F9" font-size="26" font-weight="700">0.9424 ± 0.0200</text>
    <text x="622" y="240" fill="#94A3B8" font-size="15">10 seeds</text>
    <rect x="622" y="270" width="206" height="16" rx="8" fill="#1F2A3D"/>
    <rect x="622" y="270" width="206" height="16" rx="8" fill="#F59E0B"/>
    <rect x="880" y="110" rx="20" ry="20" width="250" height="230" fill="#152033"/>
    <text x="902" y="150" fill="#94A3B8" font-size="16">ECE (any) ↓</text>
    <text x="902" y="205" fill="#F1F5F9" font-size="26" font-weight="700">0.0231 ± 0.0034</text>
    <text x="902" y="240" fill="#94A3B8" font-size="15">10 seeds</text>
    <rect x="902" y="270" width="206" height="16" rx="8" fill="#1F2A3D"/>
    <rect x="902" y="270" width="17" height="16" rx="8" fill="#F43F5E"/>
    <text x="40" y="380" fill="#94A3B8" font-size="15">1-epoch fine-tuning from a shared initial checkpoint; calibration fitted on the evaluation holdout. See docs/evaluation_notes.md.</text>
  </g>
</svg>
