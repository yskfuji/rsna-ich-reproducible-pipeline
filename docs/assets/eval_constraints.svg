<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 482" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation protocol caveats</title>
  <desc id="desc">Four constraint cards for metrics.</desc>
  <rect width="960" height="482" fill="#0B1220"/>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Yu Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">Read numbers with these constraints</text>
    <text x="40" y="74.0" fill="#94A3B8" font-size="15" font-weight="400">Headline metrics measure fine-tuning stability, not unseen-study performance.</text>
    <rect x="40" y="110" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <rect x="40" y="110" width="440" height="8" fill="#F43F5E"/>
    <text x="58" y="154" fill="#F1F5F9" font-size="18" font-weight="700">1. One epoch only</text>
    <text x="58" y="188.0" fill="#94A3B8" font-size="14" font-weight="400">Fine-tune once per fold and per seed.</text>
    <text x="58" y="206.9" fill="#94A3B8" font-size="14" font-weight="400">Subsample of 6,852 images.</text>
    <rect x="500" y="110" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <rect x="500" y="110" width="440" height="8" fill="#F59E0B"/>
    <text x="518" y="154" fill="#F1F5F9" font-size="18" font-weight="700">2. Shared init</text>
    <text x="518" y="188.0" fill="#94A3B8" font-size="14" font-weight="400">Every run starts from the same checkpoint.</text>
    <text x="518" y="206.9" fill="#94A3B8" font-size="14" font-weight="400">Trained on about 98% of studies.</text>
    <rect x="40" y="278" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <rect x="40" y="278" width="440" height="8" fill="#38BDF8"/>
    <text x="58" y="322" fill="#F1F5F9" font-size="18" font-weight="700">3. Same holdout</text>
    <text x="58" y="356.0" fill="#94A3B8" font-size="14" font-weight="400">Temperature fit uses the ECE evaluation set.</text>
    <text x="58" y="374.9" fill="#94A3B8" font-size="14" font-weight="400">Calibration metrics may be optimistic.</text>
    <rect x="500" y="278" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <rect x="500" y="278" width="440" height="8" fill="#14B8A6"/>
    <text x="518" y="322" fill="#F1F5F9" font-size="18" font-weight="700">4. Not a device</text>
    <text x="518" y="356.0" fill="#94A3B8" font-size="14" font-weight="400">Research and portfolio use only.</text>
    <text x="518" y="374.9" fill="#94A3B8" font-size="14" font-weight="400">No clinical validation.</text>
    <text x="40" y="454" fill="#94A3B8" font-size="13">Details: docs/evaluation_notes.md · Source: rsna_cv_summary.json</text>
  </g>
</svg>
