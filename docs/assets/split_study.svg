<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Study-level split vs image-level split</title>
  <desc id="desc">Comparison of study grouping versus image splits.</desc>
  <rect width="960" height="400" fill="#0B1220"/>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Yu Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="42.0" fill="#F1F5F9" font-size="26" font-weight="700">How the split avoids image-level leakage</text>
    <text x="40" y="74.0" fill="#94A3B8" font-size="15" font-weight="400">Grouping key = StudyInstanceUID. Patient-level split is not implemented yet.</text>

    <rect x="40" y="110" rx="16" ry="16" width="420" height="220" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <text x="64" y="150" fill="#14B8A6" font-size="20" font-weight="700">This repo (study split)</text>
    <rect x="64" y="175" rx="8" width="100" height="40" fill="#14B8A6"/>
    <text x="82" y="201" fill="#0F172A" font-size="14" font-weight="700">Study A</text>
    <rect x="180" y="175" rx="8" width="100" height="40" fill="#14B8A6"/>
    <text x="198" y="201" fill="#0F172A" font-size="14" font-weight="700">Study B</text>
    <rect x="296" y="175" rx="8" width="100" height="40" fill="#38BDF8"/>
    <text x="314" y="201" fill="#0F172A" font-size="14" font-weight="700">Study C</text>
    <text x="64" y="250" fill="#94A3B8" font-size="14">train = A,B · val = C</text>
    <text x="64" y="280" fill="#94A3B8" font-size="14">All slices of a study stay on one side.</text>

    <rect x="500" y="110" rx="16" ry="16" width="420" height="220" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <text x="524" y="150" fill="#F43F5E" font-size="20" font-weight="700">Risky (image split)</text>
    <rect x="524" y="175" rx="6" width="55" height="34" fill="#F43F5E"/>
    <rect x="592" y="175" rx="6" width="55" height="34" fill="#F59E0B"/>
    <rect x="660" y="175" rx="6" width="55" height="34" fill="#F43F5E"/>
    <rect x="728" y="175" rx="6" width="55" height="34" fill="#F59E0B"/>
    <rect x="796" y="175" rx="6" width="55" height="34" fill="#F43F5E"/>
    <text x="524" y="250" fill="#94A3B8" font-size="14">Slices from one study can land in</text>
    <text x="524" y="280" fill="#94A3B8" font-size="14">both train and val → optimistic scores.</text>

    <text x="40" y="370" fill="#94A3B8" font-size="13">Audit: core/pipeline/tools/audit_rsna_split.py</text>
  </g>
</svg>
