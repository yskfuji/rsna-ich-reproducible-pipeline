<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Included versus excluded artifacts</title>
  <desc id="desc">Public versus private content.</desc>
  <rect width="960" height="360" fill="#0B1220"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">What ships publicly</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">If it can identify a patient or recreate a scan, it stays private.</text>
    <rect x="40" y="110" rx="16" ry="16" width="420" height="200" fill="#152033" stroke="#84CC16" stroke-width="3"/>
    <text x="70" y="155" fill="#84CC16" font-size="22" font-weight="700">Included</text>
    <text x="70" y="195" fill="#F1F5F9" font-size="16">source · configs · tests · CI</text>
    <text x="70" y="225" fill="#F1F5F9" font-size="16">summary JSON · static figures</text>
    <text x="70" y="255" fill="#F1F5F9" font-size="16">evaluation notes · checklists</text>
    <rect x="500" y="110" rx="16" ry="16" width="420" height="200" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <text x="530" y="155" fill="#F43F5E" font-size="22" font-weight="700">Excluded</text>
    <text x="530" y="195" fill="#F1F5F9" font-size="16">RSNA DICOM / labels</text>
    <text x="530" y="225" fill="#F1F5F9" font-size="16">Datasets/ · runs/ · results/ · logs/</text>
    <text x="530" y="255" fill="#F1F5F9" font-size="16">trained weights (*.pt)</text>
  </g>
</svg>
