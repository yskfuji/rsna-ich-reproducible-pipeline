<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Reader paths</title>
  <desc id="desc">Three reviewer personas.</desc>
  <rect width="960" height="360" fill="#0B1220"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">Reviewer paths</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">Same repository, three depths. Every path ends at the evaluation caveats.</text>
    <rect x="40" y="100" rx="12" ry="12" width="880" height="60" fill="#152033"/>
    <rect x="40" y="100" width="10" height="60" fill="#38BDF8"/>
    <text x="70" y="136" fill="#F1F5F9" font-size="18" font-weight="700">Hiring manager</text>
    <text x="300" y="136" fill="#94A3B8" font-size="15">Pictures → metrics → caveats</text>
    <text x="820" y="136" fill="#38BDF8" font-size="15" font-weight="700">15 min</text>
    <rect x="40" y="180" rx="12" ry="12" width="880" height="60" fill="#152033"/>
    <rect x="40" y="180" width="10" height="60" fill="#14B8A6"/>
    <text x="70" y="216" fill="#F1F5F9" font-size="18" font-weight="700">ML engineer</text>
    <text x="300" y="216" fill="#94A3B8" font-size="15">Smoke test → split audit → code</text>
    <text x="820" y="216" fill="#14B8A6" font-size="15" font-weight="700">45 min</text>
    <rect x="40" y="260" rx="12" ry="12" width="880" height="60" fill="#152033"/>
    <rect x="40" y="260" width="10" height="60" fill="#F59E0B"/>
    <text x="70" y="296" fill="#F1F5F9" font-size="18" font-weight="700">Researcher</text>
    <text x="300" y="296" fill="#94A3B8" font-size="15">evaluation_notes → JSON → protocol</text>
    <text x="820" y="296" fill="#F59E0B" font-size="15" font-weight="700">2 h</text>
  </g>
</svg>
