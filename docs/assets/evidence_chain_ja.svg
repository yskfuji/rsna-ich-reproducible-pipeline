<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">指標の根拠連鎖</title>
  <desc id="desc">READMEの記載からスカラー値への経路。</desc>
  <rect width="960" height="310" fill="#0B1220"/>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Yu Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">READMEの数値が照合される経路</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">継続的統合は、fold別・シード別JSONから代表値を再計算する。</text>
    <rect x="40" y="110" rx="12" width="180" height="90" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <text x="56" y="150.0" fill="#F1F5F9" font-size="15" font-weight="700">1. READMEの記載</text>
    <rect x="280" y="110" rx="12" width="180" height="90" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <text x="296" y="150.0" fill="#F1F5F9" font-size="15" font-weight="700">2. 平均 ± 標準偏差</text>
    <rect x="520" y="110" rx="12" width="180" height="90" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <text x="536" y="150.0" fill="#F1F5F9" font-size="15" font-weight="700">3. 要約JSON</text>
    <rect x="760" y="110" rx="12" width="180" height="90" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <text x="776" y="150.0" fill="#F1F5F9" font-size="15" font-weight="700">4. fold / シード</text>
    <line x1="220.0" y1="155.0" x2="269.0" y2="155.0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="280.0,155.0 270.0,160.0 270.0,150.0" fill="#94A3B8"/>
    <line x1="460.0" y1="155.0" x2="509.0" y2="155.0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="520.0,155.0 510.0,160.0 510.0,150.0" fill="#94A3B8"/>
    <line x1="700.0" y1="155.0" x2="749.0" y2="155.0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="760.0,155.0 750.0,160.0 750.0,150.0" fill="#94A3B8"/>
    <text x="40" y="250" fill="#94A3B8" font-size="13">照合: scripts/check_metric_claims.py · 衛生: scripts/check_public_hygiene.py</text>
    <text x="40" y="278" fill="#94A3B8" font-size="13">制約の記述は、対象数値と同一の節に置く。</text>
  </g>
</svg>
