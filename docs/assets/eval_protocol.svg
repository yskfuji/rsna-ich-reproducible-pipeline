<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation protocol caveats</title>
  <desc id="desc">Four constraint cards for metrics.</desc>
  <rect width="960" height="360" fill="#0B1220"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">Read numbers with these constraints</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">Headline metrics measure fine-tuning stability, not unseen-study performance.</text>
    <rect x="40" y="110" rx="14" ry="14" width="200" height="170" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <rect x="40" y="110" width="200" height="8" fill="#F43F5E"/>
    <text x="54" y="158" fill="#F1F5F9" font-size="18" font-weight="700">1 epoch only</text>
    <text x="54" y="198" fill="#94A3B8" font-size="13">Fine-tune once per fold/seed</text>
    <text x="54" y="222" fill="#94A3B8" font-size="13">6,852-image subsample</text>
    <rect x="260" y="110" rx="14" ry="14" width="200" height="170" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <rect x="260" y="110" width="200" height="8" fill="#F59E0B"/>
    <text x="274" y="158" fill="#F1F5F9" font-size="18" font-weight="700">Shared init</text>
    <text x="274" y="198" fill="#94A3B8" font-size="13">Same checkpoint every run</text>
    <text x="274" y="222" fill="#94A3B8" font-size="13">trained on ~98% studies</text>
    <rect x="480" y="110" rx="14" ry="14" width="200" height="170" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <rect x="480" y="110" width="200" height="8" fill="#38BDF8"/>
    <text x="494" y="158" fill="#F1F5F9" font-size="18" font-weight="700">Same holdout</text>
    <text x="494" y="198" fill="#94A3B8" font-size="13">Temperature fit = ECE set</text>
    <text x="494" y="222" fill="#94A3B8" font-size="13">calibration optimistic</text>
    <rect x="700" y="110" rx="14" ry="14" width="200" height="170" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <rect x="700" y="110" width="200" height="8" fill="#14B8A6"/>
    <text x="714" y="158" fill="#F1F5F9" font-size="18" font-weight="700">Not a device</text>
    <text x="714" y="198" fill="#94A3B8" font-size="13">Research / portfolio only</text>
    <text x="714" y="222" fill="#94A3B8" font-size="13">no clinical validation</text>
    <text x="40" y="320" fill="#94A3B8" font-size="13">Details: docs/evaluation_notes.md · Source: core/pipeline/reports/rsna_cv_summary.json</text>
  </g>
</svg>
