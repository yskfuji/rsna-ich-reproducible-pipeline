<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Repository map</title>
  <desc id="desc">Four primary directories for reviewers.</desc>
  <rect width="1200" height="370" fill="#0B1220"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#F1F5F9" font-size="32" font-weight="700">Where to look</text>
    <text x="40" y="82" fill="#94A3B8" font-size="18">Four doors. Open them in order if you have five minutes.</text>
    <rect x="40" y="130" rx="18" ry="18" width="260" height="160" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <text x="62" y="178" fill="#F1F5F9" font-size="24" font-weight="700">README</text>
    <text x="62" y="218" fill="#94A3B8" font-size="16">30-second picture</text>
    <text x="62" y="246" fill="#94A3B8" font-size="16">then quickstart</text>
    <rect x="340" y="130" rx="18" ry="18" width="240" height="160" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <text x="362" y="178" fill="#F1F5F9" font-size="24" font-weight="700">docs/</text>
    <text x="362" y="218" fill="#94A3B8" font-size="16">figures · notes</text>
    <text x="362" y="246" fill="#94A3B8" font-size="16">glossary · audit</text>
    <rect x="620" y="130" rx="18" ry="18" width="260" height="160" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <text x="642" y="178" fill="#F1F5F9" font-size="24" font-weight="700">core/pipeline/</text>
    <text x="642" y="218" fill="#94A3B8" font-size="16">train · eval · API</text>
    <text x="642" y="246" fill="#94A3B8" font-size="16">tests · reports</text>
    <rect x="920" y="130" rx="18" ry="18" width="240" height="160" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <text x="942" y="178" fill="#F1F5F9" font-size="24" font-weight="700">scripts/</text>
    <text x="942" y="218" fill="#94A3B8" font-size="16">CI guards</text>
    <text x="942" y="246" fill="#94A3B8" font-size="16">smoke · claims</text>
    <text x="40" y="340" fill="#94A3B8" font-size="15">rsna_ich/ mirrors this landing page for portfolio reviewers who start from that folder.</text>
  </g>
</svg>
