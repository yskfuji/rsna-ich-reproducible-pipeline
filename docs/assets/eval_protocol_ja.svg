<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 482" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">評価手順上の制約</title>
  <desc id="desc">指標解釈のための四つの制約。</desc>
  <rect width="960" height="482" fill="#0B1220"/>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Yu Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">数値解釈における制約</text>
    <text x="40" y="74.0" fill="#94A3B8" font-size="15" font-weight="400">代表指標は追加学習の安定性を示すものであり、未知の検査に対する性能ではない。</text>
    <rect x="40" y="110" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <rect x="40" y="110" width="440" height="8" fill="#F43F5E"/>
    <text x="58" y="154" fill="#F1F5F9" font-size="18" font-weight="700">1. 1エポックのみ</text>
    <text x="58" y="188.0" fill="#94A3B8" font-size="14" font-weight="400">各fold・各シードで1回だけ追加学習する。</text>
    <text x="58" y="206.9" fill="#94A3B8" font-size="14" font-weight="400">対象は6,852枚の部分標本である。</text>
    <rect x="500" y="110" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#F59E0B" stroke-width="3"/>
    <rect x="500" y="110" width="440" height="8" fill="#F59E0B"/>
    <text x="518" y="154" fill="#F1F5F9" font-size="18" font-weight="700">2. 共通の初期重み</text>
    <text x="518" y="188.0" fill="#94A3B8" font-size="14" font-weight="400">全実行で同一の初期重みを用いる。</text>
    <text x="518" y="206.9" fill="#94A3B8" font-size="14" font-weight="400">検査の約98%で学習済みである。</text>
    <rect x="40" y="278" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#38BDF8" stroke-width="3"/>
    <rect x="40" y="278" width="440" height="8" fill="#38BDF8"/>
    <text x="58" y="322" fill="#F1F5F9" font-size="18" font-weight="700">3. 同一の検証データ</text>
    <text x="58" y="356.0" fill="#94A3B8" font-size="14" font-weight="400">温度推定とECE評価は同一集合である。</text>
    <text x="58" y="374.9" fill="#94A3B8" font-size="14" font-weight="400">校正指標は楽観的になりうる。</text>
    <rect x="500" y="278" rx="14" ry="14" width="440" height="150" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <rect x="500" y="278" width="440" height="8" fill="#14B8A6"/>
    <text x="518" y="322" fill="#F1F5F9" font-size="18" font-weight="700">4. 医療機器ではない</text>
    <text x="518" y="356.0" fill="#94A3B8" font-size="14" font-weight="400">研究およびポートフォリオ用途である。</text>
    <text x="518" y="374.9" fill="#94A3B8" font-size="14" font-weight="400">臨床妥当性は未検証である。</text>
    <text x="40" y="454" fill="#94A3B8" font-size="13">詳細は docs/evaluation_notes_ja.md。出典は rsna_cv_summary.json。</text>
  </g>
</svg>
