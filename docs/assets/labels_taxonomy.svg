<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">RSNA ICH label taxonomy</title>
  <desc id="desc">Schematic head with six hemorrhage labels.</desc>
  <rect width="960" height="530" fill="#0B1220"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#F1F5F9" font-size="28" font-weight="700">Six labels the model predicts</text>
    <text x="40" y="74" fill="#94A3B8" font-size="16">Schematic only — not a patient image. Classes follow Flanders et al., 2020.</text>
    <ellipse cx="250" cy="300" rx="150" ry="140" fill="#111827" stroke="#38BDF8" stroke-width="6"/>
    <ellipse cx="250" cy="300" rx="105" ry="95" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <ellipse cx="250" cy="300" rx="36" ry="48" fill="#0EA5E9" opacity="0.35"/>
    <path d="M140 220 Q250 160 360 220" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 380 Q250 430 350 380" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="250" cy="280" r="16" fill="#14B8A6" opacity="0.75"/>
    <circle cx="250" cy="320" r="12" fill="#84CC16" opacity="0.8"/>
    <text x="190" y="470" fill="#94A3B8" font-size="14">axial schematic</text>
    <rect x="520" y="120" rx="12" ry="12" width="400" height="44" fill="#152033" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="548" cy="142" r="8" fill="#14B8A6"/>
    <text x="570" y="138" fill="#14B8A6" font-size="16" font-weight="700">epidural</text>
    <text x="570" y="156" fill="#94A3B8" font-size="13">outside dura</text>
    <rect x="520" y="172" rx="12" ry="12" width="400" height="44" fill="#152033" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="548" cy="194" r="8" fill="#F59E0B"/>
    <text x="570" y="190" fill="#F59E0B" font-size="16" font-weight="700">subdural</text>
    <text x="570" y="208" fill="#94A3B8" font-size="13">under dura</text>
    <rect x="520" y="224" rx="12" ry="12" width="400" height="44" fill="#152033" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="548" cy="246" r="8" fill="#38BDF8"/>
    <text x="570" y="242" fill="#38BDF8" font-size="16" font-weight="700">subarachnoid</text>
    <text x="570" y="260" fill="#94A3B8" font-size="13">CSF spaces</text>
    <rect x="520" y="276" rx="12" ry="12" width="400" height="44" fill="#152033" stroke="#84CC16" stroke-width="2"/>
    <circle cx="548" cy="298" r="8" fill="#84CC16"/>
    <text x="570" y="294" fill="#84CC16" font-size="16" font-weight="700">intraparenchymal</text>
    <text x="570" y="312" fill="#94A3B8" font-size="13">inside brain</text>
    <rect x="520" y="328" rx="12" ry="12" width="400" height="44" fill="#152033" stroke="#F43F5E" stroke-width="2"/>
    <circle cx="548" cy="350" r="8" fill="#F43F5E"/>
    <text x="570" y="346" fill="#F43F5E" font-size="16" font-weight="700">intraventricular</text>
    <text x="570" y="364" fill="#94A3B8" font-size="13">ventricles</text>
    <rect x="520" y="380" rx="12" ry="12" width="400" height="44" fill="#152033" stroke="#C084FC" stroke-width="2"/>
    <circle cx="548" cy="402" r="8" fill="#C084FC"/>
    <text x="570" y="398" fill="#C084FC" font-size="16" font-weight="700">any</text>
    <text x="570" y="416" fill="#94A3B8" font-size="13">union of subtypes</text>
    <text x="40" y="500" fill="#94A3B8" font-size="13">Loss weights subtypes at 1 and any at 2 (community convention).</text>
  </g>
</svg>
