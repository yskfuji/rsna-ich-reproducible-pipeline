<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">検査単位分割と画像単位分割の対比</title>
  <desc id="desc">検査単位集約と画像単位分割の比較。</desc>
  <rect width="960" height="400" fill="#0B1220"/>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', 'Yu Gothic', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="42.0" fill="#F1F5F9" font-size="26" font-weight="700">画像単位の情報リークを避ける分割</text>
    <text x="40" y="74.0" fill="#94A3B8" font-size="15" font-weight="400">集約鍵は StudyInstanceUID である。患者単位分割は未実装である。</text>

    <rect x="40" y="110" rx="16" ry="16" width="420" height="220" fill="#152033" stroke="#14B8A6" stroke-width="3"/>
    <text x="64" y="150" fill="#14B8A6" font-size="20" font-weight="700">本リポジトリ（検査単位分割）</text>
    <rect x="64" y="175" rx="8" width="100" height="40" fill="#14B8A6"/>
    <text x="82" y="201" fill="#0F172A" font-size="14" font-weight="700">検査A</text>
    <rect x="180" y="175" rx="8" width="100" height="40" fill="#14B8A6"/>
    <text x="198" y="201" fill="#0F172A" font-size="14" font-weight="700">検査B</text>
    <rect x="296" y="175" rx="8" width="100" height="40" fill="#38BDF8"/>
    <text x="314" y="201" fill="#0F172A" font-size="14" font-weight="700">検査C</text>
    <text x="64" y="250" fill="#94A3B8" font-size="14">学習はAとB、検証はC</text>
    <text x="64" y="280" fill="#94A3B8" font-size="14">同一検査のスライスは一方にのみ属する。</text>

    <rect x="500" y="110" rx="16" ry="16" width="420" height="220" fill="#152033" stroke="#F43F5E" stroke-width="3"/>
    <text x="524" y="150" fill="#F43F5E" font-size="20" font-weight="700">危険な例（画像単位分割）</text>
    <rect x="524" y="175" rx="6" width="55" height="34" fill="#F43F5E"/>
    <rect x="592" y="175" rx="6" width="55" height="34" fill="#F59E0B"/>
    <rect x="660" y="175" rx="6" width="55" height="34" fill="#F43F5E"/>
    <rect x="728" y="175" rx="6" width="55" height="34" fill="#F59E0B"/>
    <rect x="796" y="175" rx="6" width="55" height="34" fill="#F43F5E"/>
    <text x="524" y="250" fill="#94A3B8" font-size="14">同一検査のスライスが</text>
    <text x="524" y="280" fill="#94A3B8" font-size="14">学習と検証の双方に入り、成績を過大評価しうる。</text>

    <text x="40" y="370" fill="#94A3B8" font-size="13">監査スクリプト: core/pipeline/tools/audit_rsna_split.py</text>
  </g>
</svg>
